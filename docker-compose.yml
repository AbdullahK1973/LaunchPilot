services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: launchpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - launchpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d launchpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  launchpilot-postgres:
