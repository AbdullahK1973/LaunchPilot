name: CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/launchpilot
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:hosting
      - name: Package Sites deployment
        run: tar -czf launchpilot-sites.tar.gz .open-next .openai/hosting.json
      - uses: actions/upload-artifact@v4
        with:
          name: launchpilot-sites
          path: launchpilot-sites.tar.gz
          retention-days: 3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
